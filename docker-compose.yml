services:
  wordpress:
    build:
      context: ./docker/caddy
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${WORDPRESS_PORT}:80
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WP_URL: ${WP_URL}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      PLUGIN_FOLDER_NAME: ${PLUGIN_FOLDER_NAME}
      THEME_FOLDER_NAME: ${THEME_FOLDER_NAME}
    volumes:
      - ./data/wordpress:/app/public
      - ./plugin:/app/public/wp-content/plugins/${PLUGIN_FOLDER_NAME}
      - ./theme:/app/public/wp-content/themes/${THEME_FOLDER_NAME}
    tmpfs:
      - /tmp:size=256M
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=64M
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-flush-method=O_DIRECT
      - --performance-schema=OFF
      - --skip-log-bin
      - --max-connections=50
      - --table-open-cache=400
      - --tmp-table-size=64M
      - --max-heap-table-size=64M
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: ${DB_ROOT_PASSWORD_RANDOM}
    volumes:
      - ./data/mysql:/var/lib/mysql
    tmpfs:
      - /tmp:size=128M
    # TCP ping (-h 127.0.0.1) fails while MySQL runs its temporary init server
    # with --skip-networking, so the check passes only when the DB is really ready.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  adminer:
    image: adminer:standalone
    restart: unless-stopped
    ports:
      - 127.0.0.1:${ADMINER_PORT}:8080
    environment:
      ADMINER_DEFAULT_SERVER: ${DB_HOST}

  bun:
    build:
      context: ./docker/bun
      dockerfile: Dockerfile
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    working_dir: /app
    environment:
      BUN_INSTALL_CACHE_DIR: /tmp/bun-cache
    volumes:
      - ./:/app
    command: sh -c "bun install && bun run dev"
